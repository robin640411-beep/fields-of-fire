<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#26372d">
<title>Fields of Fire｜戰火洗禮</title>
<link rel="stylesheet" href="style.css">
<script defer src="lesson-readings.js"></script>
<script defer src="marker-guide.js"></script>
<script defer src="unit-faces.js"></script>
<script defer src="vehicle-faces.js"></script>
<script defer src="vehicle-counters.js"></script>
<script defer src="air-load-faces.js"></script>
<script defer src="us-counters.js"></script>
<script defer src="enemy-counters.js"></script>
<link rel="stylesheet" href="table-motion.css">
<script defer src="lesson-attacks.js"></script>
<script defer src="lesson-motion.js"></script>
<script defer src="table-motion.js"></script>
<script defer src="assets/decks.js"></script><script defer src="assets/pieces.js"></script><script defer src="scenarios.js"></script><script defer src="engine.js"></script><script defer src="quick.js"></script><script defer src="assets/mission-tables.js"></script>
<script defer src="mission-markers.js"></script>
<script defer src="assets/fm2-catalog.js"></script><script defer src="course.js"></script><script defer src="lessons-p12.js"></script><script defer src="lessons-c12.js"></script><script defer src="lessons-p3c3.js"></script><script defer src="fm2-example.js"></script><script defer src="fm2-vehicles.js"></script><script defer src="fm2-air-aid.js"></script><script defer src="fm2-setup.js"></script><script defer src="fm2-reorganization.js"></script><script defer src="lesson-ui.js"></script><script defer src="draw-view.js"></script><script defer src="lesson-commands.js"></script><script defer src="command-display.js"></script><script defer src="marker-bindings.js"></script><script defer src="marker-layout.js"></script><script defer src="terrain-table.js"></script><script defer src="table-draw.js"></script><script defer src="assets/campaign/terrain.js"></script><script defer src="assets/terrain-borders.js"></script><script defer src="terrain-visibility.js"></script><script defer src="assets/campaign/pieces.js"></script><script defer src="cam-K.js"></script><script defer src="cam-H.js"></script><script defer src="cam-V.js"></script><script defer src="unit-counters.js"></script><script defer src="campaigns.js"></script><script defer src="campaign-series.js"></script><script defer src="campaign-air.js"></script><script defer src="campaign-history.js"></script><script defer src="campaign-ui.js"></script><script defer src="terrain-legend.js"></script><script defer src="motion-events.js"></script><script defer src="app.js"></script>
</head>
<body>
<header class="mast"><div class="mast-inner">
  <div class="brand"><span class="crest" aria-hidden="true"><i></i><b></b></span><div><strong>FIELDS OF FIRE</strong><small>戰 火 洗 禮</small></div></div>
  <section id="hero" aria-label="目前任務"></section>
  <div class="mast-tools"><button data-action="guide">遊戲說明</button><button data-action="saves">存檔</button></div>
</div>
  <nav class="campaign-nav" aria-label="戰役">
    <strong>戰役</strong>
    <a href="?campaign=N" data-action="camBook" data-value="N">諾曼第</a>
    <a href="?campaign=K" data-action="camBook" data-value="K">洛東江</a>
    <a href="?campaign=H" data-action="camBook" data-value="H">傷心嶺</a>
    <a href="?campaign=V" data-action="camBook" data-value="V">越南</a>
  </nav>
</header>
<main class="shell"><div class="desk">
  <section class="board-pane" aria-labelledby="boardTitle">
    <div class="boardbar">
      <div class="board-title"><span class="tiny-grid" aria-hidden="true"></span><h2 id="boardTitle">地形棋桌</h2><span id="mapSize"></span><span id="boardPhase" class="board-phase" aria-live="polite"></span></div>
      <div class="board-tools" id="terrainTools">
        <button data-action="airPlan" id="airPlanButton" hidden>裝載與管制卡</button>
        <button data-action="fitBoard" id="fitBoard" aria-pressed="true" title="顯示整張棋桌">全圖</button>
        <div class="zoom-controls" role="group" aria-label="棋桌大小">
          <button data-action="zoomOut" aria-label="縮小棋桌">−</button><output id="boardScale" aria-label="棋桌比例"></output><button data-action="zoomIn" aria-label="放大棋桌">＋</button>
        </div>
      </div>
    </div>
    <div class="map-pad" id="mapViewport" tabindex="0" role="region" aria-label="地形棋桌，可捲動">
      <div id="board">
        <div class="table-supply">
          <section class="table-piles" aria-label="行動牌">
            <div class="action-pile"><div class="pile-label">行動牌組 <output id="deckRemaining" aria-live="polite"></output></div>
              <button type="button" id="drawPile" data-action="flipAction"><img src="assets/action-back.webp" alt="行動牌背面" draggable="false"></button></div>
            <div class="action-pile"><div class="pile-label">棄牌堆</div>
              <button type="button" id="discardPile" data-action="inspectDiscard" disabled><img id="discardFace" alt="" hidden draggable="false"></button></div>
          </section>
          <div id="pilePrompt" aria-live="polite"></div>
          <figure id="command-display" tabindex="-1" aria-label="指揮顯示表">
          <div id="commandPaper"></div>
          <figcaption id="sheetSelection" hidden><label for="commandUnit">登記指揮部</label><select id="commandUnit"></select></figcaption>
          </figure>
        </div>
        <div id="terrainGrid" class="mapgrid"></div>
      </div>
    </div>
    <div class="mapkey" id="mapKey"><span><i class="key-piece"></i>友軍</span><span><i class="key-destination"></i>可移入</span><span><i class="key-target">⚑</i>目標</span><span class="play-edge">玩家側・第 1 列在下方</span></div>
  </section>
  <aside class="command-dock" aria-label="棋桌控制"><div id="side"></div>
    <details class="command-record"><summary>命令標記明細</summary><div id="commandState"></div></details>
    <section id="roster"></section><footer><span id="savedStatus">本機自動存檔</span></footer>
  </aside>
</div></main>
<figure id="terrainPreview" role="tooltip" hidden><figcaption></figcaption><img alt=""><span class="preview-symbol" hidden></span><p class="marker-rule" hidden></p><dl class="piece-legend" hidden></dl><small hidden></small><div class="terrain-legend" hidden></div></figure>
<dialog id="panel"><div id="modalBody"></div></dialog>
<dialog id="historyViewer" aria-labelledby="historyFigureSource" aria-describedby="historyFigureCaption">
 <header><strong id="historyFigureSource"></strong><div class="buttonrow"><button type="button" id="historyZoom" aria-pressed="false">原尺寸</button><button type="button" id="historyDone">返回閱讀</button></div></header>
 <div class="history-canvas"><img id="historyFullImage" alt=""></div><p id="historyFigureCaption"></p>
</dialog>
<dialog id="drawViewer" aria-labelledby="drawHeading">
 <header class="draw-head"><div><small>行動牌組</small><h2 id="drawHeading"></h2></div><span id="drawCount" aria-live="polite"></span></header>
 <div id="drawFaces"></div><p id="drawHint"></p>
 <footer class="draw-foot"><div><button id="drawPrev" type="button">上一頁</button><button id="drawNext" type="button">下一頁</button></div><button class="primary" id="drawFinish" type="button">讀畢，繼續</button></footer>
</dialog>
<div id="toast" role="status" aria-live="polite"></div><input type="file" id="importFile" accept=".json,application/json" hidden>
</body></html>
